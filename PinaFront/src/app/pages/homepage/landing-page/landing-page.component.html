
<div *ngIf="categorie.length === 0">



</div>


<div class="min-h-[600px] m-3 rounded-3xl ">


  <div class="justify-center bg-slate-300 p-2 rounded-3xl min-h-[800px] w-full flex items-center ">


    <div >
      <h1>Al Momento La Pinacoteca é vuota</h1>
    </div>


  </div>



</div>





<div class="min-h-[600px] m-3 rounded-3xl " *ngFor="let lista of categorie">

  <div class=" flex max-md:flex-col  mt-10 bg-slate-400 xl:h-[100px] rounded-t-3xl bottom-0 md:justify-between items-center md:mt-0">

    <div class=" pt-3 pb-3 md:ml-10 md:pt-3 md:pb-0">
      <h3 class="text-3xl">{{lista.name}}</h3>
    </div>

    <div class="pt-3 pb-3 md:pt-3 md:pb-0">

      <input type="text" class="form-control" aria-label="Text input with dropdown button">

    </div>

    <div class="md:mr-10 pt-3 pb-3 md:pt-3 md:pb-0">
      <h3 class="text-3xl">Curatore: {{lista.curatore?.name}}</h3>
    </div>

  </div>

  <div class="justify-center bg-slate-300 p-2 rounded-b-3xl min-h-[500px] w-full flex flex-wrap md:justify-between">

    <div class="bg-slate-400 h-[450px] w-[350px] m-8 rounded-3xl" *ngFor="let item of lista.items">

      <div class="bg-white h-[350px] mt-2 ml-2 mr-2 rounded-3xl" >
        <img [src]="item.img" alt="quadro" class="object-cover object-center h-100 rounded-3xl">
      </div>

      <a class="text-center cursor-pointer no-underline text-black">
        <h4 class="mt-[30px] ">{{item.title}}</h4>
      </a>

    </div>


  </div>



</div>
